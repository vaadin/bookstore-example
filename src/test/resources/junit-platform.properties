## Enable JUnit Jupiter extension auto-detection via ServiceLoader.
## Required so that com.vaadin.testbench.loadtest.K6RecordingExtension
## (registered in META-INF/services in testbench-loadtest-support) is
## picked up automatically when running TestBench ITs under the
## testbench-converter-plugin's `record` goal.
##
## Setting this here (instead of via -D system property) ensures the
## flag is honored even when the test JVM is forked by maven-failsafe-plugin,
## which does not propagate arbitrary system properties from the outer
## Maven invocation.
junit.jupiter.extensions.autodetection.enabled=true

