server.port=${PORT:8080}

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false
# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages = com.vaadin,org.vaadin,org.vaadin.example.bookstore

management.server.port=8082
management.endpoints.web.exposure.include=health,metrics,prometheus


# --- Distributed tracing -> Jaeger (OTLP) ---
# Service name shown in the Jaeger UI.
spring.application.name=bookstore-example
# Export every trace. Lower this (e.g. 0.1) in production to reduce overhead.
management.tracing.sampling.probability=1.0
# Jaeger's OTLP/HTTP trace receiver (jaeger all-in-one listens on 4318).
# Transport defaults to http, matching the /v1/traces endpoint below.
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
# Only traces go to Jaeger over OTLP. Metrics are scraped via Prometheus
# (/actuator/prometheus), so turn off the OTLP metrics and logs push that the
# OpenTelemetry starter enables by default -- Jaeger has no /v1/metrics or
# /v1/logs receiver and would otherwise log publish failures every interval.
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
 management.observations.enable.spring.security=false
